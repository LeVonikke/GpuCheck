# gpucheck.cfg - optional configuration for GpuCheck.efi
#
# Install to:  \EFI\GPUCHECK\gpucheck.cfg  on the EFI System Partition.
#
# This file is entirely optional. If it is missing, GpuCheck simply shows
# every PCI display adapter it finds and decides on its own whether a
# probable discrete GPU is present.
#
# Lines are KEY=VALUE. '#' and ';' start a comment. Unknown keys are ignored.
# A malformed line is skipped; it can never stop the PCI scan from running.

# ---------------------------------------------------------------------------
# EXPECT_VENDOR / EXPECT_DEVICE
#
# The board you are testing should contain this GPU. When set, the pass/fail
# verdict is based on whether THIS device enumerated, instead of on the
# integrated-vs-discrete heuristic. This is the reliable choice for repair
# work: it removes all guessing.
#
#   10DE = NVIDIA      1002 = AMD / ATI
#   8086 = Intel       1022 = AMD
#
# EXPECT_DEVICE may be a hex device ID, or ANY to accept any GPU from that
# vendor.
# ---------------------------------------------------------------------------

#EXPECT_VENDOR=10DE
#EXPECT_DEVICE=ANY

# ---------------------------------------------------------------------------
# Boot behaviour
#
# AUTOBOOT_WHEN_FOUND  1 = continue to Windows automatically when the expected
#                          (or a probable discrete) GPU is present
#                      0 = always wait for a keypress
#
# AUTOBOOT_DELAY       seconds to wait before booting automatically
#
# HALT_WHEN_MISSING    1 = stop and wait indefinitely when the GPU is missing.
#                          This is the whole point of the tool - leave it at 1
#                          unless you specifically want unattended boots.
#                      0 = boot anyway after AUTOBOOT_DELAY
# ---------------------------------------------------------------------------

AUTOBOOT_WHEN_FOUND=1
AUTOBOOT_DELAY=3
HALT_WHEN_MISSING=1

# ---------------------------------------------------------------------------
# LOG_ENABLE  1 = write the scan result to \EFI\GPUCHECK\lastscan.txt
#             0 = never write to the ESP
#
# Logging is best effort. Some firmware presents the ESP read-only at this
# point; that is not an error and the on-screen result is unaffected.
# ---------------------------------------------------------------------------

LOG_ENABLE=1

# ---------------------------------------------------------------------------
# BOOT_PATH - override the chainload target.
#
# Only needed if your Windows Boot Manager backup lives somewhere unusual.
# The default search order already covers the normal layouts.
# ---------------------------------------------------------------------------

#BOOT_PATH=\EFI\Microsoft\Boot\bootmgfw-original.efi
